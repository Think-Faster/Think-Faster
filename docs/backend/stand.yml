# Стенд у нас (ML/INTEGRATION.md §12.3, этап 6): инфраструктура — файлами think-infra без изменений
# (Redis, RabbitMQ, Kafka с их пользователями, топиками и ACL), плюс то, чего в ней для стенда нет:
# Vault с секретами и ролями AppRole по схеме think-infra, PostgreSQL со схемой аудита, эмулятор
# think-test. Пароли — тестовые, только в stand.env (не в git; образец — stand.env.example).
#
#   docker network create think-fast-net
#   docker compose -f docs/backend/stand.yml --env-file docs/backend/stand.env up -d
#   docker compose -f docs/backend/compose.yml --env-file docs/backend/stand.env \
#     --env-file docs/backend/.vault/approle.env up -d --build
#
# Проверка цепочки: эмулятор → воронка (забирает сама, TF_FUNNEL_PULL) → tf.ingest.* → модель →
# tf.forecast.results; /status воронки и модели, события — в audit.events.
name: tf-stand

include:
  - path: ${TF_INFRA:?TF_INFRA — клон think-infra}/redis/docker-compose.yml
    env_file: stand.env
  - path: ${TF_INFRA}/rabbitmq/docker-compose.yml
    env_file: stand.env
  - path: ${TF_INFRA}/kafka/docker-compose.yml
    env_file: stand.env

services:

  # Dev-Vault; в сети под тем же именем, что у Гриши: vault:8200.
  tf-vault:
    container_name: tf-vault
    image: hashicorp/vault:1.20.0          # как в think-infra (hashicorp/docker-compose.yml)
    command: server -dev -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${TF_VAULT_ROOT_TOKEN:?TF_VAULT_ROOT_TOKEN is not set}
    cap_add: [IPC_LOCK]
    networks:
      think-fast-net:
        aliases: [vault]
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # Одноразовый: секреты по схеме think-infra (§13.5) и роли AppRole tf-svc-<сервис>, как у
  # hashicorp/scripts/setup.sh, — читать только свои пути. role_id и secret_id — в .vault/approle.env
  # (env-файл для compose.yml). Dev-Vault хранит всё в памяти: после перезапуска tf-vault — снова
  # `up tf-vault-seed`.
  tf-vault-seed:
    container_name: tf-vault-seed
    image: hashicorp/vault:1.20.0          # как в think-infra (hashicorp/docker-compose.yml)
    depends_on:
      tf-vault: {condition: service_healthy}
    networks: [think-fast-net]
    environment:
      VAULT_ADDR: http://tf-vault:8200
      VAULT_TOKEN: ${TF_VAULT_ROOT_TOKEN}
      KAFKA_MODEL: ${TF_KAFKA_MODEL_PASSWORD}
      KAFKA_FUNNEL: ${TF_KAFKA_FUNNEL_PASSWORD}
      RABBIT_MODEL: ${TF_RABBIT_MODEL_PASSWORD}
      RABBIT_EMAIL: ${TF_RABBIT_EMAIL_PASSWORD}
      RABBIT_TELEGRAM: ${TF_RABBIT_TELEGRAM_PASSWORD}
      REDIS: ${TF_REDIS_PASSWORD:?TF_REDIS_PASSWORD is not set}
      AUDIT_DB: ${TF_PG_AUDIT_USER_PASSWORD:?TF_PG_AUDIT_USER_PASSWORD is not set}
      SMTP_USER: ${TF_STAND_SMTP_USER:-}
      SMTP_PASSWORD: ${TF_STAND_SMTP_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TF_STAND_TELEGRAM_BOT_TOKEN:-}
      MODEL_SUBS: ${TF_STAND_MODEL_SUBS:-}
      NOTIFY_SUBS: ${TF_STAND_NOTIFY_SUBS:-}
      AUDIT_SUBS: ${TF_STAND_AUDIT_SUBS:-}
      FUNNEL_SUBS: ${TF_STAND_FUNNEL_SUBS:-}
    volumes:
      - ${TF_VAULT_TOKENS:-./.vault}:/tokens
    entrypoint: ["sh", "-euc"]
    command:
      - |
        # put <путь> поле=значение...: пустые поля не пишутся (значения без пробелов)
        put() {
          p=$$1; shift; args=""
          for kv in "$$@"; do [ -n "$${kv#*=}" ] && args="$$args $$kv"; done
          if [ -n "$$args" ]; then vault kv put "secret/tf/$$p" $$args >/dev/null; echo "secret/tf/$$p"; fi
        }
        put kafka/model TF_KAFKA_MODEL_PASSWORD="$$KAFKA_MODEL"
        put kafka/funnel TF_KAFKA_FUNNEL_PASSWORD="$$KAFKA_FUNNEL"
        put rabbit/model TF_RABBIT_MODEL_PASSWORD="$$RABBIT_MODEL"
        put rabbit/email TF_RABBIT_EMAIL_PASSWORD="$$RABBIT_EMAIL"
        put rabbit/telegram TF_RABBIT_TELEGRAM_PASSWORD="$$RABBIT_TELEGRAM"
        put redis TF_REDIS_PASSWORD="$$REDIS"
        put postgres/audit TF_PG_AUDIT_USER_PASSWORD="$$AUDIT_DB"
        put app/tf-model TF_MODEL_SERVICE_SUBS="$$MODEL_SUBS"
        put app/tf-funnel TF_FUNNEL_SERVICE_SUBS="$$FUNNEL_SUBS"
        put app/tf-audit TF_AUDIT_SERVICE_SUBS="$$AUDIT_SUBS"
        put app/tf-notify TF_NOTIFY_SMTP_USER="$$SMTP_USER" TF_NOTIFY_SMTP_PASSWORD="$$SMTP_PASSWORD" \
          TF_NOTIFY_TELEGRAM_BOT_TOKEN="$$TELEGRAM_BOT_TOKEN" TF_NOTIFY_SERVICE_SUBS="$$NOTIFY_SUBS"
        # role <сервис> <имя в env> <путь>...: политика и AppRole tf-svc-<сервис>, как setup.sh think-infra
        vault auth list | grep -q '^approle/' || vault auth enable approle >/dev/null
        : > /tokens/approle.env
        role() {
          s=$$1; e=$$2; shift 2
          for p in "$$@"; do printf 'path "secret/data/tf/%s" {\n  capabilities = ["read"]\n}\n' "$$p"; done \
            | vault policy write "tf-svc-$$s" - >/dev/null
          vault write "auth/approle/role/tf-svc-$$s" token_policies="tf-svc-$$s" token_ttl=5m token_max_ttl=15m \
            secret_id_ttl=0 secret_id_num_uses=0 >/dev/null
          echo "TF_$${e}_VAULT_ROLE_ID=$$(vault read -field=role_id "auth/approle/role/tf-svc-$$s/role-id")" >> /tokens/approle.env
          echo "TF_$${e}_VAULT_SECRET_ID=$$(vault write -f -field=secret_id "auth/approle/role/tf-svc-$$s/secret-id")" >> /tokens/approle.env
          echo "роль tf-svc-$$s: $$*"
        }
        role tf-model MODEL kafka/model rabbit/model redis app/tf-model
        role tf-funnel FUNNEL kafka/funnel redis app/tf-funnel
        role tf-notify NOTIFY rabbit/email rabbit/telegram redis app/tf-notify
        role tf-audit AUDIT postgres/audit redis app/tf-audit
        chmod 644 /tokens/approle.env
    restart: "no"

  # У Гриши роли и схему создаёт bootstrap think-infra (postgree/db); на стенде — tf-audit-db-init.
  tf-postgres:
    container_name: tf-postgres
    image: postgres:16
    environment:
      POSTGRES_DB: tf
      POSTGRES_USER: tf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
    volumes:
      - tf-stand-postgres:/var/lib/postgresql/data
    networks: [think-fast-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tf -d tf"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # Одноразовый: schema.sql (повторно без вреда) и пароль роли audit_user — тот же, что в Vault.
  tf-audit-db-init:
    container_name: tf-audit-db-init
    image: postgres:16
    depends_on:
      tf-postgres: {condition: service_healthy}
    networks: [think-fast-net]
    environment:
      PGHOST: tf-postgres
      PGUSER: tf
      PGDATABASE: tf
      PGPASSWORD: ${POSTGRES_PASSWORD}
      AUDIT_DB: ${TF_PG_AUDIT_USER_PASSWORD}
    volumes:
      - ./audit/schema.sql:/schema.sql:ro
    entrypoint: ["sh", "-euc"]
    command:
      - |
        psql -q -v ON_ERROR_STOP=1 -v writer=audit_user -f /schema.sql
        echo "alter role audit_user password :'pw';" | psql -q -v ON_ERROR_STOP=1 -v pw="$$AUDIT_DB"
        echo "схема audit готова"
    restart: "no"

  # Эмулятор потока think-test: одни сутки журнала по текущим часам, ускорение и сбои из панели.
  tf-emulator:
    container_name: tf-emulator
    image: python:3.12-slim
    working_dir: /app/emulator
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    command: ["sh", "-c", "pip install -q --no-cache-dir --root-user-action=ignore -r requirements.txt && exec python manage.py runserver 0.0.0.0:8000 --noreload"]
    volumes:
      - ${TF_TEST:?TF_TEST — клон think-test}:/app:ro
    networks: [think-fast-net]
    ports:
      - "127.0.0.1:${TF_EMULATOR_PORT:-8090}:8000"   # панель эмулятора: ускорение, сбои
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      start_period: 60s
    restart: unless-stopped

volumes:
  tf-stand-postgres:
    name: tf-stand-postgres

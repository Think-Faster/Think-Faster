# Наши сервисы вокруг модели: модель, воронка, уведомления, аудит (ML/INTEGRATION.md §12.3, этапы 6 и 8).
# Встают в сеть think-fast-net рядом с think-infra и зовут её по тем же именам: tf-kafka, tf-rabbit,
# tf-redis, tf-postgres, vault. Секреты — только из Vault, по схеме think-infra: сервис входит своей
# ролью AppRole tf-svc-<сервис> (hashicorp/services.conf) и читает только свои пути; в окружении и в
# образах паролей нет. role_id и secret_id роли — в env-файле: на сервере их выдаёт
# `hashicorp/scripts/setup.sh service-credentials tf-<сервис>`, на стенде — tf-vault-seed в .vault/approle.env.
#
#   у нас:        сначала стенд (stand.yml), затем
#                 docker compose -f docs/backend/compose.yml --env-file docs/backend/stand.env \
#                   --env-file docs/backend/.vault/approle.env up -d --build
#   на сервере:   этот файл и .env с role_id и secret_id; сеть и инфраструктура — Гриши (этап 8)
name: tf-services

x-service: &service
  restart: unless-stopped
  networks: [think-fast-net]
  mem_limit: 512m

x-env: &env
  TF_ENV: ${TF_ENV:-prod}
  VAULT_ADDR: ${TF_VAULT_ADDR:-http://vault:8200}
  TF_VAULT_WAIT: ${TF_VAULT_WAIT:-900}   # Vault Гриши после перезапуска запечатан: ждать, а не падать
  TF_REDIS_URL: redis://tf-redis:6379/0  # пароль — из Vault secret/tf/redis
  TF_AUTH_JWKS: ${TF_AUTH_JWKS:-http://tf-auth:8080/.well-known/jwks}
  TF_AUTH_PUBLIC_KEY: ${TF_AUTH_PUBLIC_KEY:-}   # открытый ключ think-auth (PEM); пусто — с JWKS

services:

  tf-model:
    <<: *service
    container_name: tf-model
    build: {context: ../.., dockerfile: ML/service/Dockerfile}
    image: tf-model:${TF_TAG:-local}
    environment:
      <<: *env
      TF_MODEL_CLOCK: ${TF_MODEL_CLOCK:-live}
      VAULT_ROLE_ID: ${TF_MODEL_VAULT_ROLE_ID:?TF_MODEL_VAULT_ROLE_ID — role_id роли tf-svc-tf-model}
      VAULT_SECRET_ID: ${TF_MODEL_VAULT_SECRET_ID:?TF_MODEL_VAULT_SECRET_ID is not set}
    volumes:
      - ${TF_MODEL_BUNDLE_DIR:?TF_MODEL_BUNDLE_DIR — папка пакета модели (bundle.py, §13.6)}:/models/current:ro
      - tf-ml-work:/work
    mem_limit: 4g                       # горячий журнал DuckDB (TF_MEMORY 2GB) и модели в памяти

  tf-funnel:
    <<: *service
    container_name: tf-funnel
    build: {context: ., dockerfile: funnel/Dockerfile}
    image: tf-funnel:${TF_TAG:-local}
    environment:
      <<: *env
      TF_FUNNEL_PULL: ${TF_FUNNEL_PULL:-}             # стенд: http://tf-emulator:8000
      TF_FUNNEL_SILENT_MIN: ${TF_FUNNEL_SILENT_MIN:-60}
      TF_AUDIT_SPOOL: /tmp/tf-audit.spool
      VAULT_ROLE_ID: ${TF_FUNNEL_VAULT_ROLE_ID:?TF_FUNNEL_VAULT_ROLE_ID — role_id роли tf-svc-tf-funnel}
      VAULT_SECRET_ID: ${TF_FUNNEL_VAULT_SECRET_ID:?TF_FUNNEL_VAULT_SECRET_ID is not set}

  tf-notify:
    <<: *service
    container_name: tf-notify
    build: {context: ., dockerfile: notify/Dockerfile}
    image: tf-notify:${TF_TAG:-local}
    environment:
      <<: *env
      TF_RABBIT_URL: amqp://tf-rabbit:5672/tf
      NOTIFY_CHANNELS: ${NOTIFY_CHANNELS:-email,telegram}
      TF_AUDIT_SPOOL: /tmp/tf-audit.spool
      VAULT_ROLE_ID: ${TF_NOTIFY_VAULT_ROLE_ID:?TF_NOTIFY_VAULT_ROLE_ID — role_id роли tf-svc-tf-notify}
      VAULT_SECRET_ID: ${TF_NOTIFY_VAULT_SECRET_ID:?TF_NOTIFY_VAULT_SECRET_ID is not set}

  tf-audit:
    <<: *service
    container_name: tf-audit
    build: {context: ., dockerfile: audit/Dockerfile}
    image: tf-audit:${TF_TAG:-local}
    environment:
      <<: *env
      TF_AUDIT_DB: ${TF_AUDIT_DB:-host=tf-postgres dbname=tf user=audit_user}
      VAULT_ROLE_ID: ${TF_AUDIT_VAULT_ROLE_ID:?TF_AUDIT_VAULT_ROLE_ID — role_id роли tf-svc-tf-audit}
      VAULT_SECRET_ID: ${TF_AUDIT_VAULT_SECRET_ID:?TF_AUDIT_VAULT_SECRET_ID is not set}

volumes:
  tf-ml-work:
    name: tf-ml-work

networks:
  think-fast-net:
    external: true

# Модель tf-model на prod (thinkfaster.ru). Собирается только модель — воронка и эмулятор не
# пересобираются. Как на dev (deploy-model-dev.yml): образ собирается здесь (ML/service/Dockerfile),
# пакет модели из приватного релиза dev-assets запекается слоем в /models/current, и образ переносится
# на сервер файлом (docker save → scp → docker load). В реестр его не кладём: в образе справочники и
# модели. Сборка на самом сервере отнимала бы память у работающего prod (свободно ~3,5 ГБ).
#
# Нужно в настройках репозитория:
#   секреты репозитория PROD_IP, PROD_USER, PROD_SSH_KEY (вход на сервер prod);
#   окружение prod с MODEL_VAULT_ROLE_ID и MODEL_VAULT_SECRET_ID роли tf-svc-tf-model —
#     в контейнер уходят под прежними именами VAULT_ROLE_ID / VAULT_SECRET_ID.
# Запуск только вручную (Actions → Deploy tf-model to prod → Run workflow): prod — после проверки на dev.
name: Deploy tf-model to prod

on:
  workflow_dispatch:

concurrency:
  group: deploy-model-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  MODEL_ASSET: model-pa3.tar.gz

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Check secrets
        env:
          PROD_IP: ${{ secrets.PROD_IP }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          MODEL_VAULT_ROLE_ID: ${{ secrets.MODEL_VAULT_ROLE_ID }}
          MODEL_VAULT_SECRET_ID: ${{ secrets.MODEL_VAULT_SECRET_ID }}
        run: |
          missing=""
          for name in PROD_IP PROD_USER PROD_SSH_KEY MODEL_VAULT_ROLE_ID MODEL_VAULT_SECRET_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::не заданы секреты:$missing (PROD_* — репозиторий; MODEL_VAULT_* — окружение prod)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker build -f ML/service/Dockerfile -t tf-model:base .
          mkdir -p bundle img
          gh release download dev-assets -R "$GITHUB_REPOSITORY" -p "$MODEL_ASSET" -O bundle.tar.gz
          tar -xzf bundle.tar.gz -C bundle
          test -f bundle/manifest.json
          printf 'FROM tf-model:base\nCOPY --chown=10001 . /models/current\n' \
            | docker build -t tf-model:prod -f - bundle
          docker save tf-model:prod | gzip -1 > img/tf-model.tar.gz
          ls -lh img

      - name: Copy image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_IP }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: img/tf-model.tar.gz
          target: tf-images/model
          strip_components: 1
          rm: true
          timeout: 5m
          command_timeout: 30m

      - name: Restart tf-model
        uses: appleboy/ssh-action@v1.0.3
        env:
          VAULT_ROLE_ID: ${{ secrets.MODEL_VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.MODEL_VAULT_SECRET_ID }}
        with:
          host: ${{ secrets.PROD_IP }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: VAULT_ROLE_ID,VAULT_SECRET_ID
          command_timeout: 30m
          script: |
            set -e
            [ -n "$VAULT_ROLE_ID" ] || { echo "нет MODEL_VAULT_ROLE_ID в окружении prod (роль tf-svc-tf-model)" >&2; exit 1; }
            [ -n "$VAULT_SECRET_ID" ] || { echo "нет MODEL_VAULT_SECRET_ID в окружении prod (роль tf-svc-tf-model)" >&2; exit 1; }
            docker network inspect think-fast-net >/dev/null
            gunzip -c ~/tf-images/model/tf-model.tar.gz | docker load
            rm -f ~/tf-images/model/tf-model.tar.gz

            docker rm -f tf-model >/dev/null 2>&1 || true
            # секреты — только из Vault; памяти на сервере мало: DuckDB модели — 1 ГБ вместо 2 ГБ
            docker run -d --name tf-model \
              --network think-fast-net \
              --restart unless-stopped \
              --memory 2500m \
              -v tf-ml-work:/work \
              -e TF_ENV=prod \
              -e VAULT_ADDR=http://vault:8200 \
              -e TF_VAULT_WAIT=900 \
              -e TF_REDIS_URL=redis://tf-redis:6379/0 \
              -e TF_AUTH_JWKS=http://tf-auth:8080/.well-known/jwks \
              -e TF_MODEL_CLOCK=live \
              -e TF_MEMORY=1GB \
              -e VAULT_ROLE_ID \
              -e VAULT_SECRET_ID \
              tf-model:prod

            sleep 30
            docker logs --tail 40 tf-model
            [ "$(docker inspect -f '{{.State.Running}}' tf-model)" = true ] \
              || { echo "tf-model не запущен" >&2; exit 1; }
            if docker logs tf-model 2>&1 | grep -qi 'permission denied'; then
              echo "tf-model: Vault отказал во входе (permission denied) — проверьте пару MODEL_VAULT_*" >&2
              exit 1
            fi
            docker image prune -f >/dev/null
